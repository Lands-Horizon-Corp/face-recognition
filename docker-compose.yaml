services:
  robyn:
    container_name: robyn-api
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./face_recognition_api:/code/face_recognition_api
      - ./src:/code/src
      - ./models:/code/models
      - ./.env:/code/.env
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_USERNAME=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=robyn_db
      - APP_ENV=development
      - IS_LOCAL=true


    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=robyn_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-setup/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_face_recognition
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
